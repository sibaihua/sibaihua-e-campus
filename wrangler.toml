# 司白画大学清迈分校「我的E校园」— Cloudflare Worker 配置
#
# 重要（Workers Builds / Git 集成机制）：
#   - 每次 Git push 触发构建部署时，Worker 的 绑定(Bindings) 和 普通变量(Variables)
#     都会重置为 wrangler.toml 里声明的内容 → 所以 D1 绑定与默认变量写在这里
#   - 敏感值（SECRET / TURNSTILE_SECRET / RESEND_API_KEY）不能进仓库，
#     必须在控制台以 Secret 类型添加 —— Secret 不会被构建覆盖

name = "sibaihua-e-campus"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 静态前端资源（自动托管 public/ 目录）
[assets]
directory = "./public"
not_found_handling = "none"

# ─────────────────────────────────────────────────────────────────────
# D1 数据库绑定（随代码部署，构建不会被重置）
[[d1_databases]]
binding = "DB"
database_name = "sibaihua-e-campus"
database_id = "6cdfa903-19d3-4f51-8b5a-55af7543c197"
# ─────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────
# 非敏感默认变量（随代码部署；⚠️ 会覆盖控制台同名普通变量）
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAEWvmxLZVjDXieV9"
MAIL_API_BASE = "https://mail.sibaihua.com"
MAIL_FROM = "no-reply@sibh.cn"
MAIL_FROM_NAME = "司白画大学清迈分校 · 我的E校园"
# ─────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────
# 敏感值请在 Workers 控制台 → Settings → Variables 以 Secret 类型添加
# （Secret 不会被构建覆盖；普通 Variable 会被清空，切勿用普通变量存密钥）：
#   SECRET                密码加密密钥（生产必改，≥32 位随机串）
#   TURNSTILE_SECRET      Cloudflare Turnstile 服务端密钥
#   RESEND_API_KEY       Resend API Key（可选）
#   SEED_ADMIN_PASSWORD   首次部署自动创建的管理员 iam 的密码（可选）
# ─────────────────────────────────────────────────────────────────────
